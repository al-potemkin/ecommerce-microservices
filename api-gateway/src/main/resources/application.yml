spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          observability:
            enabled: true
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/products/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/order/**
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/inventory/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}


management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  tracing:
    sampling:
      probability: 1
  otlp:
    metrics:
      export:
        enabled: false
  endpoint:
    gateway:
      access: read-only   # в более старых версиях Boot: enabled: true

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "