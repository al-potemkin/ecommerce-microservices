services:
  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-stub:8080
      INVENTORY_SERVICE_URL: http://inventory-stub:8080
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ecommerce
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "8080:8080"
    networks: [ backend, edge ]
    depends_on:
      redis:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD}
      NOTIFICATION_SERVICE_SECRET: ${NOTIFICATION_SERVICE_SECRET}
      PRODUCT_SERVICE_SECRET: ${PRODUCT_SERVICE_SECRET}
      ORDER_SERVICE_SECRET: ${ORDER_SERVICE_SECRET}
      INVENTORY_SERVICE_SECRET: ${INVENTORY_SERVICE_SECRET}
      ANALYTICS_SERVICE_SECRET: ${ANALYTICS_SERVICE_SECRET}
      DLT_PROCESSOR_SERVICE_SECRET: ${DLT_PROCESSOR_SERVICE_SECRET}
    ports:
      - "127.0.0.1:8180:8080"
    networks: [ backend, edge ]
    volumes:
      - ./api-gateway/keycloak:/opt/keycloak/data/import
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KC_DB_NAME}
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks: [ backend ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [ "sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\"" ]
    ports:
      - "127.0.0.1:6379:6379"
    networks: [ backend ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- product-service ----------
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    depends_on:
      product-mongo:
        condition: service_healthy
      product-redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      MONGODB_HOST: product-mongo
      MONGODB_PORT: 27017
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME}
      PRODUCT_DB_USER: ${PRODUCT_DB_USER}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      REDIS_HOST: product-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${PRODUCT_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:8081:8081"
    networks: [ backend, edge ]

  product-mongo:
    image: mongo:7
    container_name: product-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME}
      PRODUCT_DB_USER: ${PRODUCT_DB_USER}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    networks: [ backend, edge ]
    volumes:
      - product-mongo-data:/data/db
      - ./product-service/docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  product-redis:
    image: redis:7-alpine
    container_name: product-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${PRODUCT_REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - "127.0.0.1:6380:6379"
    networks: [ backend, edge ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    internal: true
  edge:

volumes:
  keycloak-db-data:
  product-mongo-data: