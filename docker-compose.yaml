# ---------- General blocks ----------
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-spring-healthcheck: &spring-healthcheck
  test: [ "CMD", "curl", "-fso", "/dev/null", "http://localhost:8080/actuator/health/readiness" ]
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 40s

x-pg-healthcheck: &pg-healthcheck
  test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
  interval: 5s
  timeout: 3s
  retries: 10

x-redis-healthcheck: &redis-healthcheck
  test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
  interval: 10s
  timeout: 5s
  retries: 5

x-spring-service: &spring-service
  restart: unless-stopped
  networks: [ backend ]
  healthcheck: *spring-healthcheck
  logging: *logging

x-postgres: &postgres
  image: postgres:16
  restart: unless-stopped
  networks: [ backend ]
  healthcheck: *pg-healthcheck
  logging: *logging

# Публичный issuer (то, что попадает в claim iss) и внутренний JWK-адрес внутри сети compose.
x-jwt-env: &jwt-env
  JWT_ISSUER_URI: ${KC_PUBLIC_URL:?KC_PUBLIC_URL is required}/realms/${KC_REALM:-ecommerce}
  JWT_JWK_SET_URI: http://keycloak:8080/realms/${KC_REALM:-ecommerce}/protocol/openid-connect/certs

x-kafka-client-env: &kafka-client-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081

services:
  # ----------- auth -----------
  api-gateway:
    <<: *spring-service
    build: ./api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PRODUCT_SERVICE_URL: http://product-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      USER_SERVICE_URL: http://user-service:8080
      KEYCLOAK_ISSUER_URI: ${KC_PUBLIC_URL:?KC_PUBLIC_URL is required}/realms/${KC_REALM:-ecommerce}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${KC_REALM:-ecommerce}/protocol/openid-connect/certs
      REDIS_HOST: redis
      REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD:?GATEWAY_REDIS_PASSWORD is required}
    ports:
      - "8080:8080"
    networks: [ backend, edge ]
    depends_on:
      redis:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # В dev realm импортируется автоматически (import + тестовые пользователи — в override).
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_HOSTNAME: ${KC_PUBLIC_URL:?KC_PUBLIC_URL is required}
      KC_HEALTH_ENABLED: "true"   # /health/* на management-порту 9000
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD is required}
    networks: [ backend, edge ]
    healthcheck:
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/localhost/9000
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *logging
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${KC_DB_NAME}
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

  # Redis для rate limiting в gateway.
  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD:?GATEWAY_REDIS_PASSWORD is required}
    command: [ "sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save \"\" --appendonly no" ]
    networks: [ backend ]
    healthcheck: *redis-healthcheck
    logging: *logging

  # ----------- user-service -----------
  user-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
    volumes:
      - user-db-data:/var/lib/postgresql/data

  user-service:
    <<: *spring-service
    build: ./user-service
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      <<: *jwt-env
      SPRING_PROFILES_ACTIVE: prod
      USER_DB_HOST: user-db
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}

  # ----------- order-service -----------
  order-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD is required}
    volumes:
      - order-db-data:/var/lib/postgresql/data

  order-service:
    <<: *spring-service
    build: ./order-service
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      <<: [ *jwt-env, *kafka-client-env ]
      SPRING_PROFILES_ACTIVE: prod
      ORDER_DB_HOST: order-db
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      ORDER_DB_USER: ${ORDER_DB_USER}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/${KC_REALM:-ecommerce}/protocol/openid-connect/token
      ORDER_SERVICE_SECRET: ${ORDER_SERVICE_SECRET:?ORDER_SERVICE_SECRET is required}
      PRODUCT_SERVICE_URL: http://product-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080

  # --------- inventory-service ---------
  inventory-db:
    <<: *postgres
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD is required}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data

  inventory-service:
    <<: *spring-service
    build: ./inventory-service
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      <<: [ *jwt-env, *kafka-client-env ]
      SPRING_PROFILES_ACTIVE: prod
      INVENTORY_DB_HOST: inventory-db
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}

  # ---------- product-service ----------
  product-service:
    <<: *spring-service
    build: ./product-service
    depends_on:
      product-mongo:
        condition: service_healthy
      product-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      <<: [ *jwt-env, *kafka-client-env ]
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_HOST: product-mongo
      MONGODB_PORT: 27017
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME}
      PRODUCT_DB_USER: ${PRODUCT_DB_USER}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      REDIS_HOST: product-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${PRODUCT_REDIS_PASSWORD:?PRODUCT_REDIS_PASSWORD is required}

  product-mongo:
    image: mongo:7.0
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        if [ ! -f /data/configdb/keyfile ]; then
          head -c 756 /dev/urandom | base64 > /data/configdb/keyfile
        fi
        chmod 400 /data/configdb/keyfile
        chown mongodb:mongodb /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PRODUCT_MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PRODUCT_MONGO_ROOT_PASSWORD:?PRODUCT_MONGO_ROOT_PASSWORD is required}
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME}
      PRODUCT_DB_USER: ${PRODUCT_DB_USER}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD is required}
    volumes:
      - product-mongo-data:/data/db
      - ./product-service/docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./product-service/docker/mongo/healthcheck.js:/healthcheck.js:ro
    # Логика инициализации replica set вынесена в скрипт.
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --file /healthcheck.js
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [ backend ]
    logging: *logging

  product-redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${PRODUCT_REDIS_PASSWORD:?PRODUCT_REDIS_PASSWORD is required}
    command: [ "sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 128mb --maxmemory-policy allkeys-lru --save \"\" --appendonly no" ]
    networks: [ backend ]
    healthcheck: *redis-healthcheck
    logging: *logging

  # ----------- kafka -----------
  kafka:
    image: confluentinc/cp-kafka:8.4.0
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [ backend ]
    logging: *logging

  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.0
    hostname: schema-registry
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ub", "sr-ready", "localhost", "8081", "5"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ backend ]
    logging: *logging

networks:
  backend:
    internal: true
  edge:

volumes:
  keycloak-db-data:
  product-mongo-data:
  kafka-data:
  inventory-db-data:
  order-db-data:
  user-db-data: