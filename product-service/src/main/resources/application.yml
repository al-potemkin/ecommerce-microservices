spring:
  application:
    name: product-service
  mongodb:
    uri: mongodb://${PRODUCT_DB_USER}:${PRODUCT_DB_PASSWORD}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${PRODUCT_DB_NAME}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false